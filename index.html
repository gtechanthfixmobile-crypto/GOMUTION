<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOMUTION — Global Student & Inventor Project Stream</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: rgba(17, 25, 46, 0.72);
      --bg-glass: rgba(255, 255, 255, 0.05);
      --border-glass: rgba(125, 211, 252, 0.18);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --neon-cyan: #22d3ee;
      --neon-violet: #a855f7;
      --neon-emerald: #10b981;
      --danger: #f43f5e;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(34, 211, 238, 0.14), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.14), transparent 42%),
        var(--bg-dark);
      color: var(--text-main);
      min-height: 100dvh;
      padding-bottom: 48px;
      line-height: 1.5;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px;
    }

    .glass {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius);
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
    }

    header.top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      margin-bottom: 16px;
      border-color: rgba(34, 211, 238, 0.28);
    }

    .brand h1 {
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-violet));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.76rem;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      color: var(--neon-cyan);
    }

    .badge.warn {
      color: #fbbf24;
      border-color: rgba(251, 191, 36, 0.35);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--neon-cyan);
    }

    .field {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"],
    input[type="file"],
    textarea,
    select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(9, 14, 28, 0.85);
      color: var(--text-main);
      font-size: 0.92rem;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.16);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--neon-cyan) 50%),
        linear-gradient(135deg, var(--neon-cyan) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(34, 211, 238, 0.4);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(168, 85, 247, 0.22));
      color: #fff;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .btn:hover {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.25);
    }

    .btn.secondary {
      background: var(--bg-glass);
      border-color: rgba(148, 163, 184, 0.28);
      color: var(--text-main);
    }

    .btn.danger {
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
      padding: 6px 11px;
      font-size: 0.78rem;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .msg {
      margin-top: 10px;
      font-size: 0.84rem;
      min-height: 18px;
    }

    .msg.ok { color: var(--neon-emerald); }
    .msg.err { color: var(--danger); }

    .filter-bar {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr;
      gap: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .filter-bar {
        grid-template-columns: 1fr;
      }
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .post-card {
      padding: 18px;
      border-color: rgba(168, 85, 247, 0.24);
    }

    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .tag {
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.12);
      color: var(--neon-cyan);
      border: 1px solid rgba(34, 211, 238, 0.28);
      font-weight: 600;
    }

    .post-title {
      font-size: 1.15rem;
      margin-bottom: 8px;
    }

    .post-notes {
      white-space: pre-wrap;
      color: #cbd5e1;
      font-size: 0.92rem;
      margin-bottom: 12px;
    }

    .media-box img,
    .media-box video {
      width: 100%;
      max-height: 420px;
      border-radius: 14px;
      background: #020617;
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 36px 18px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="top-bar glass">
      <div class="brand">
        <h1>GOMUTION</h1>
        <p>Lightweight Student & Inventor Project Stream • Text-Serialized Payload Engine</p>
      </div>
      <div class="status-row">
        <span id="dbStatusBadge" class="badge warn">Connecting /config...</span>
        <span id="sessionBadge" class="badge">Guest</span>
        <button id="logoutBtn" class="btn secondary" style="display:none;" type="button">Log Out</button>
      </div>
    </header>

    <div class="grid-2">
      <!-- Custom RTDB Auth Panel (No Firebase Auth / Email Verification) -->
      <section id="authSection" class="panel glass">
        <h2>Inventor Account (RTDB Custom Auth)</h2>
        <div class="field">
          <label for="authUsername">Inventor Handle / Username</label>
          <input id="authUsername" type="text" placeholder="e.g. scientist_godfrey" autocomplete="off" />
        </div>
        <div class="field">
          <label for="authPasscode">Passcode</label>
          <input id="authPasscode" type="password" placeholder="Enter passcode (min 4 chars)" />
        </div>
        <div class="btn-row">
          <button id="loginBtn" class="btn" type="button">Sign In</button>
          <button id="registerBtn" class="btn secondary" type="button">Create Account</button>
        </div>
        <div id="authMsg" class="msg"></div>
      </section>

      <!-- Project Submission Panel -->
      <section class="panel glass">
        <h2>Publish Project Build</h2>
        <form id="postForm">
          <div class="field">
            <label for="postTitle">Project Title</label>
            <input id="postTitle" type="text" placeholder="e.g. Dual-Motor PVC Chassis & Coil Rig" required />
          </div>
          <div class="grid-2" style="gap:10px; margin-bottom:0;">
            <div class="field">
              <label for="postCategory">Engineering Track</label>
              <select id="postCategory">
                <option value="Robotics & Mechanics">Robotics & Mechanics</option>
                <option value="Electronics & Circuits">Electronics & Circuits</option>
                <option value="Software & AI">Software & AI</option>
                <option value="Renewable & Physics">Renewable & Physics</option>
              </select>
            </div>
            <div class="field">
              <label for="postMediaFile">Image (≤3MB) or Video (3–20m, ≤45MB)</label>
              <input id="postMediaFile" type="file" accept="image/*,video/*" />
            </div>
          </div>
          <div class="field">
            <label for="postNotes">Technical Notes & Build Breakdown</label>
            <textarea id="postNotes" placeholder="Share schematics, materials, observations, and next steps..."></textarea>
          </div>
          <button id="publishBtn" class="btn" type="submit">Serialize & Publish</button>
          <div id="postMsg" class="msg"></div>
        </form>
      </section>
    </div>

    <!-- Search, Filter & Sort -->
    <section class="filter-bar glass">
      <input id="searchInput" type="text" placeholder="Search projects, inventors, or notes..." />
      <select id="categoryFilter">
        <option value="ALL">All Tracks</option>
        <option value="Robotics & Mechanics">Robotics & Mechanics</option>
        <option value="Electronics & Circuits">Electronics & Circuits</option>
        <option value="Software & AI">Software & AI</option>
        <option value="Renewable & Physics">Renewable & Physics</option>
      </select>
      <select id="sortSelect">
        <option value="NEWEST">Newest First</option>
        <option value="OLDEST">Oldest First</option>
        <option value="TITLE">Title (A–Z)</option>
      </select>
    </section>

    <main id="feedContainer" class="feed">
      <div class="empty-state glass">Loading projects...</div>
    </main>
  </div>

  <!-- Firebase Compat SDKs for lightweight single-file browser execution -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script>
    (() => {
      const MAX_IMAGE_BYTES = 3 * 1024 * 1024;      // 3 MB
      const MAX_VIDEO_BYTES = 45 * 1024 * 1024;     // 45 MB
      const MIN_VIDEO_SECONDS = 3 * 60;             // 3 minutes (180s)
      const MAX_VIDEO_SECONDS = 20 * 60;            // 20 minutes (1200s)

      // Strict anti-movie / anti-piracy keyword blocklist
      const PIRACY_BLOCKLIST = /\b(full\s*movie|movie\s*download|camrip|hdcam|webrip|bluray|dvdrip|torrent|yts|123movies|fmovies|soap2day|netflix|season\s*\d+\s*ep(isode)?\s*\d+|official\s*film|cinema\s*cam|bootleg)\b/i;

      const LOCAL_POSTS_KEY = "gomution_text_posts_v1";
      const LOCAL_USERS_KEY = "gomution_text_users_v1";
      const LOCAL_SESSION_KEY = "gomution_active_user_v1";

      let db = null;
      let usingFirebase = false;
      let postsCache = [];
      let currentUser = localStorage.getItem(LOCAL_SESSION_KEY) || "";

      const els = {
        dbStatusBadge: document.getElementById("dbStatusBadge"),
        sessionBadge: document.getElementById("sessionBadge"),
        logoutBtn: document.getElementById("logoutBtn"),
        authSection: document.getElementById("authSection"),
        authUsername: document.getElementById("authUsername"),
        authPasscode: document.getElementById("authPasscode"),
        loginBtn: document.getElementById("loginBtn"),
        registerBtn: document.getElementById("registerBtn"),
        authMsg: document.getElementById("authMsg"),
        postForm: document.getElementById("postForm"),
        postTitle: document.getElementById("postTitle"),
        postCategory: document.getElementById("postCategory"),
        postMediaFile: document.getElementById("postMediaFile"),
        postNotes: document.getElementById("postNotes"),
        publishBtn: document.getElementById("publishBtn"),
        postMsg: document.getElementById("postMsg"),
        searchInput: document.getElementById("searchInput"),
        categoryFilter: document.getElementById("categoryFilter"),
        sortSelect: document.getElementById("sortSelect"),
        feedContainer: document.getElementById("feedContainer"),
      };

      // --- Lightweight Text Serialization & Deserialization Helpers ---
      function encodeTextPayload(obj) {
        const jsonStr = JSON.stringify(obj);
        const bytes = new TextEncoder().encode(jsonStr);
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binary);
      }

      function decodeTextPayload(encodedStr) {
        if (typeof encodedStr !== "string" || !encodedStr.trim()) return null;
        try {
          const binary = atob(encodedStr.trim());
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          const jsonStr = new TextDecoder().decode(bytes);
          return JSON.parse(jsonStr);
        } catch {
          try {
            return JSON.parse(encodedStr);
          } catch {
            return null;
          }
        }
      }

      function hashPasscode(handle, pass) {
        const raw = `${handle.toLowerCase()}::${pass}`;
        let h = 2166136261;
        for (let i = 0; i < raw.length; i++) {
          h ^= raw.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return (h >>> 0).toString(16);
      }

      function formatDayStamp(ts) {
        const d = new Date(ts);
        const dayName = d.toLocaleDateString(undefined, { weekday: "short" });
        const dateStr = d.toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
        return `${dayName}, ${dateStr}`;
      }

      function setMsg(el, text, isError = false) {
        el.textContent = text;
        el.className = `msg ${text ? (isError ? "err" : "ok") : ""}`;
      }

      function updateSessionUI() {
        if (currentUser) {
          els.sessionBadge.textContent = `@${currentUser}`;
          els.logoutBtn.style.display = "inline-flex";
        } else {
          els.sessionBadge.textContent = "Guest";
          els.logoutBtn.style.display = "none";
        }
      }

      // --- Initialize Firebase via Cloudflare Pages Function (/config) ---
      async function initFirebaseFromEndpoint() {
        try {
          const res = await fetch("/config", { cache: "no-store" });
          const data = await res.json();

          let cfg = data && data.firebaseConfig ? data.firebaseConfig : null;
          if (!cfg && data && typeof data.rawText === "string") {
            const match = data.rawText.match(/\{[\s\S]*\}/);
            if (match) {
              const normalized = match[0].replace(/([{,]\s*)([A-Za-z0-9_$]+)\s*:/g, '$1"$2":');
              cfg = JSON.parse(normalized);
            }
          }

          if (!cfg || !cfg.databaseURL) {
            throw new Error("Missing databaseURL in /config payload");
          }

          if (!firebase.apps.length) {
            firebase.initializeApp(cfg);
          }
          db = firebase.database();
          usingFirebase = true;
          els.dbStatusBadge.textContent = "Firebase RTDB Connected";
          els.dbStatusBadge.className = "badge";

          db.ref("gomution/textPosts").on("value", (snapshot) => {
            const rawMap = snapshot.val() || {};
            const list = [];
            Object.entries(rawMap).forEach(([id, entry]) => {
              const serialized = typeof entry === "string" ? entry : entry && entry.payload;
              const decoded = decodeTextPayload(serialized);
              if (decoded && decoded.title) {
                list.push({ id, ...decoded });
              }
            });
            postsCache = list;
            renderFeed();
          });
        } catch (err) {
          usingFirebase = false;
          els.dbStatusBadge.textContent = "Local Text Mode (/config offline)";
          els.dbStatusBadge.className = "badge warn";
          loadLocalPosts();
          renderFeed();
        }
      }

      function loadLocalPosts() {
        const rawList = JSON.parse(localStorage.getItem(LOCAL_POSTS_KEY) || "[]");
        postsCache = rawList
          .map((item) => {
            const decoded = decodeTextPayload(item.payload || "");
            return decoded ? { id: item.id, ...decoded } : null;
          })
          .filter(Boolean);
      }

      function saveLocalPostsList(list) {
        const encodedList = list.map((p) => {
          const { id, ...rest } = p;
          return { id, payload: encodeTextPayload(rest) };
        });
        localStorage.setItem(LOCAL_POSTS_KEY, JSON.stringify(encodedList));
      }

      // --- Custom RTDB Auth (Username + Passcode) ---
      async function getUsersMap() {
        if (usingFirebase && db) {
          const snap = await db.ref("gomution/textUsers").get();
          return snap.val() || {};
        }
        return JSON.parse(localStorage.getItem(LOCAL_USERS_KEY) || "{}");
      }

      async function saveUserRecord(cleanHandle, encodedRecord) {
        if (usingFirebase && db) {
          await db.ref(`gomution/textUsers/${cleanHandle}`).set(encodedRecord);
        } else {
          const map = JSON.parse(localStorage.getItem(LOCAL_USERS_KEY) || "{}");
          map[cleanHandle] = encodedRecord;
          localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(map));
        }
      }

      els.registerBtn.addEventListener("click", async () => {
        const handle = els.authUsername.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
        const pass = els.authPasscode.value;
        if (handle.length < 3) {
          return setMsg(els.authMsg, "Handle must be at least 3 letters/numbers/underscores.", true);
        }
        if (pass.length < 4) {
          return setMsg(els.authMsg, "Passcode must be at least 4 characters.", true);
        }

        const users = await getUsersMap();
        if (users[handle]) {
          return setMsg(els.authMsg, "That inventor handle is already taken. Try Sign In.", true);
        }

        const record = {
          handle,
          passHash: hashPasscode(handle, pass),
          createdAt: Date.now(),
        };
        await saveUserRecord(handle, encodeTextPayload(record));
        currentUser = handle;
        localStorage.setItem(LOCAL_SESSION_KEY, currentUser);
        updateSessionUI();
        setMsg(els.authMsg, `Account created for @${handle}. Ready to post!`);
      });

      els.loginBtn.addEventListener("click", async () => {
        const handle = els.authUsername.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
        const pass = els.authPasscode.value;
        if (!handle || !pass) {
          return setMsg(els.authMsg, "Enter both handle and passcode.", true);
        }

        const users = await getUsersMap();
        const rawEntry = users[handle];
        if (!rawEntry) {
          return setMsg(els.authMsg, "Account not found. Create an account first.", true);
        }
        const decoded = decodeTextPayload(typeof rawEntry === "string" ? rawEntry : rawEntry.payload);
        if (!decoded || decoded.passHash !== hashPasscode(handle, pass)) {
          return setMsg(els.authMsg, "Incorrect passcode.", true);
        }

        currentUser = handle;
        localStorage.setItem(LOCAL_SESSION_KEY, currentUser);
        updateSessionUI();
        setMsg(els.authMsg, `Signed in as @${handle}.`);
      });

      els.logoutBtn.addEventListener("click", () => {
        currentUser = "";
        localStorage.removeItem(LOCAL_SESSION_KEY);
        updateSessionUI();
        setMsg(els.authMsg, "Signed out.");
      });

      // --- Media Validation & Client-Side Compression ---
      function compressImageToDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("Could not read image file."));
          reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("Invalid image data."));
            img.onload = () => {
              const maxDim = 1080;
              let { width, height } = img;
              if (width > maxDim || height > maxDim) {
                if (width >= height) {
                  height = Math.round((height * maxDim) / width);
                  width = maxDim;
                } else {
                  width = Math.round((width * maxDim) / height);
                  height = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, width, height);

              let quality = 0.78;
              let dataUrl = canvas.toDataURL("image/jpeg", quality);
              while (dataUrl.length * 0.75 > MAX_IMAGE_BYTES && quality > 0.25) {
                quality -= 0.1;
                dataUrl = canvas.toDataURL("image/jpeg", quality);
              }
              if (dataUrl.length * 0.75 > MAX_IMAGE_BYTES) {
                return reject(new Error("Compressed image still exceeds 3MB limit."));
              }
              resolve({ mime: "image/jpeg", dataUrl });
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }

      function validateAndReadVideo(file) {
        return new Promise((resolve, reject) => {
          if (file.size > MAX_VIDEO_BYTES) {
            return reject(new Error("Video exceeds the 45MB maximum size limit."));
          }
          const objectUrl = URL.createObjectURL(file);
          const vid = document.createElement("video");
          vid.preload = "metadata";
          vid.onloadedmetadata = () => {
            const duration = vid.duration;
            URL.revokeObjectURL(objectUrl);
            if (!Number.isFinite(duration) || duration < MIN_VIDEO_SECONDS || duration > MAX_VIDEO_SECONDS) {
              return reject(new Error("Video duration must be between 3 minutes and 20 minutes."));
            }
            const reader = new FileReader();
            reader.onerror = () => reject(new Error("Could not read video file."));
            reader.onload = () => resolve({
              mime: file.type || "video/mp4",
              dataUrl: reader.result,
              durationSec: Math.round(duration),
            });
            reader.readAsDataURL(file);
          };
          vid.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            reject(new Error("Could not inspect video metadata."));
          };
          vid.src = objectUrl;
        });
      }

      // --- Publish Project ---
      els.postForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const title = els.postTitle.value.trim();
        const notes = els.postNotes.value.trim();
        const category = els.postCategory.value;
        const file = els.postMediaFile.files[0] || null;

        if (!title) {
          return setMsg(els.postMsg, "Please enter a project title.", true);
        }

        const combinedText = `${title} ${notes} ${file ? file.name : ""}`;
        if (PIRACY_BLOCKLIST.test(combinedText)) {
          return setMsg(
            els.postMsg,
            "Blocked: Content appears to match movie/piracy keywords. GOMUTION is strictly for original student & inventor builds.",
            true
          );
        }

        els.publishBtn.disabled = true;
        setMsg(els.postMsg, "Validating & serializing payload...");

        try {
          let mediaPayload = null;
          if (file) {
            if (file.type.startsWith("image/")) {
              if (file.size > MAX_IMAGE_BYTES * 2.5) {
                throw new Error("Original image is too large to compress under 3MB.");
              }
              mediaPayload = await compressImageToDataUrl(file);
            } else if (file.type.startsWith("video/")) {
              mediaPayload = await validateAndReadVideo(file);
            } else {
              throw new Error("Only image or video files are supported.");
            }
          }

          const now = Date.now();
          const postObj = {
            author: currentUser || "inventor_guest",
            title,
            category,
            notes,
            media: mediaPayload,
            createdAt: now,
            dayStamp: formatDayStamp(now),
          };

          const serializedPayload = encodeTextPayload(postObj);
          const newId = `post_${now}_${Math.random().toString(36).slice(2, 7)}`;

          if (usingFirebase && db) {
            await db.ref(`gomution/textPosts/${newId}`).set(serializedPayload);
          } else {
            const nextList = [{ id: newId, ...postObj }, ...postsCache];
            postsCache = nextList;
            saveLocalPostsList(nextList);
            renderFeed();
          }

          els.postForm.reset();
          setMsg(els.postMsg, "Project serialized as lightweight text and published!");
        } catch (err) {
          setMsg(els.postMsg, err.message || "Failed to publish project.", true);
        } finally {
          els.publishBtn.disabled = false;
        }
      });

      // --- Render Feed + IntersectionObserver Video Auto-Pause ---
      let videoObserver = null;

      function setupVideoAutoPause() {
        if (videoObserver) videoObserver.disconnect();
        const videos = document.querySelectorAll("video.auto-pause-video");
        if (!videos.length || !("IntersectionObserver" in window)) return;

        videoObserver = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              const vid = entry.target;
              if (!entry.isIntersecting && !vid.paused) {
                vid.pause();
              }
            });
          },
          { threshold: 0.35 }
        );

        videos.forEach((v) => videoObserver.observe(v));
      }

      async function deletePost(postId) {
        if (usingFirebase && db) {
          await db.ref(`gomution/textPosts/${postId}`).remove();
        } else {
          postsCache = postsCache.filter((p) => p.id !== postId);
          saveLocalPostsList(postsCache);
          renderFeed();
        }
      }

      function renderFeed() {
        const query = els.searchInput.value.trim().toLowerCase();
        const cat = els.categoryFilter.value;
        const sort = els.sortSelect.value;

        let filtered = postsCache.filter((p) => {
          const matchesCat = cat === "ALL" || p.category === cat;
          const haystack = `${p.title} ${p.notes} ${p.author} ${p.category}`.toLowerCase();
          const matchesQuery = !query || haystack.includes(query);
          return matchesCat && matchesQuery;
        });

        filtered.sort((a, b) => {
          if (sort === "OLDEST") return (a.createdAt || 0) - (b.createdAt || 0);
          if (sort === "TITLE") return String(a.title).localeCompare(String(b.title));
          return (b.createdAt || 0) - (a.createdAt || 0);
        });

        els.feedContainer.innerHTML = "";
        if (!filtered.length) {
          els.feedContainer.innerHTML = `<div class="empty-state glass">No matching projects yet. Publish the first build above!</div>`;
          return;
        }

        filtered.forEach((post) => {
          const card = document.createElement("article");
          card.className = "post-card glass";

          const meta = document.createElement("div");
          meta.className = "post-meta";

          const leftMeta = document.createElement("span");
          leftMeta.textContent = `@${post.author || "inventor_guest"} • ${post.dayStamp || formatDayStamp(post.createdAt || Date.now())}`;

          const rightMeta = document.createElement("div");
          rightMeta.style.display = "flex";
          rightMeta.style.alignItems = "center";
          rightMeta.style.gap = "8px";

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = post.category || "Build";
          rightMeta.appendChild(tag);

          if (currentUser && post.author === currentUser) {
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "btn danger";
            delBtn.textContent = "Delete";
            delBtn.addEventListener("click", () => deletePost(post.id));
            rightMeta.appendChild(delBtn);
          }

          meta.appendChild(leftMeta);
          meta.appendChild(rightMeta);

          const titleEl = document.createElement("h3");
          titleEl.className = "post-title";
          titleEl.textContent = post.title;

          const notesEl = document.createElement("p");
          notesEl.className = "post-notes";
          notesEl.textContent = post.notes || "";

          card.appendChild(meta);
          card.appendChild(titleEl);
          if (post.notes) card.appendChild(notesEl);

          if (post.media && post.media.dataUrl) {
            const mediaBox = document.createElement("div");
            mediaBox.className = "media-box";
            if (String(post.media.mime).startsWith("image/")) {
              const img = document.createElement("img");
              img.src = post.media.dataUrl;
              img.alt = post.title;
              img.loading = "lazy";
              mediaBox.appendChild(img);
            } else if (String(post.media.mime).startsWith("video/")) {
              const vid = document.createElement("video");
              vid.className = "auto-pause-video";
              vid.src = post.media.dataUrl;
              vid.controls = true;
              vid.playsInline = true;
              mediaBox.appendChild(vid);
            }
            card.appendChild(mediaBox);
          }

          els.feedContainer.appendChild(card);
        });

        setupVideoAutoPause();
      }

      els.searchInput.addEventListener("input", renderFeed);
      els.categoryFilter.addEventListener("change", renderFeed);
      els.sortSelect.addEventListener("change", renderFeed);

      updateSessionUI();
      initFirebaseFromEndpoint();
    })();
  </script>
</body>
</html>
